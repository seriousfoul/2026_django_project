<!DOCTYPE html>
<html lang="zh-Tw">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    {% load static %}
    <link href="{% static "css/backend.css" %}" rel="stylesheet" type="text/css" />
    {% block title %}{% endblock %}
</head>
<body>
	<div class="backend">
		<div class="backendMainMenu">
			<img src="{% static "img/structure/logo1.webp" %}" ><br>
			{% for type, typeName in menu.items %}
        	<button class="btn btn-outline-danger" onclick="changeIndex('{{type}}')" >{{typeName}}</button><br>
        	{% endfor %}
		</div>
		<div class="backendInfo">
			{% block content %}{% endblock %}    
		</div>
	</div>
</body>
<script>
    window.addEventListener("message", function(event) {
        if (event.data.msg) {
            alert(event.data.msg);
        }
        if (event.data.route){
            document.getElementById("page").src = event.data.route;
        }
    });
</script>
</html>
