{% extends "front_template.htm" %}
{% load static %}

{% block title%}
	<title>史打克工業 - 檔案下載</title>
{% endblock%}	

{% block content%}
  <div id="topic">
   <table class="table table-sm  table-dark" style="font-size:20px; text-align: center;" id="rawTable" >
      <tr>
        <th width="15%">檔案名稱</th>
        <th width="8%">版本</th>
        <th width="8%">容量</th>
        <th width="10%">更新時間</th>
        <th>備註</th>
        <th width="5%">下載</th>      
     </tr>
   {% for row in downloads%}
     <tr>
       <td>{{row.name}}</td>
       <td>{{row.version}}</td>
       <td>{{row.size}}</td>
       <td><script>document.write(new Date(Number({{row.lastUpdate}}) * 1000).toLocaleString());</script></td>
			 <td><pre>{{row.info}}</pre></td>     
       <td><a href="{{row.filepath}}" download>💾</a></td>         
     </tr>
   {% endfor %}
  </table>
  </div>  
{% endblock %}
