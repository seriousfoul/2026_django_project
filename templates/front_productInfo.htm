{% extends "front_template.htm" %}
{% load static %}
{% block title%}

    <title>史打克工業 - 產品資訊</title>
{% endblock %}
{% block content%}
   <table class="table table-dark productItemInfo table-sm table-bordered">
     <tr>
       <th width="20%">產品名稱：</th><td width="40%">{{product.name}}</td>
       <th colspan="2" width="40%">產品圖示</th>
     </tr>
      <tr>
       <th >更新時間：</th><td><script>document.write(new Date(Number({{product.lastUpdate}}) * 1000).toLocaleString());</script></td>
       <td rowspan="4" colspan="2"><img style="width: 100%; height: auto;" src="{{product.imgpath}}"></td>
     </tr>
     <tr>
       <th>產品材質：</th><td>{{product.material}}</td>       
     </tr>
     <tr>
       <th rowspan="2">產品尺寸：</th>
       <td rowspan="2"><pre>{{product.dimension}}</pre></td>
     </tr>
     <tr></tr>
    <tr>
      <th rowspan="2">備註：</th>
      <td rowspan="2" colspan="3"><pre>{{product.info}}</pre></td>
     </tr>
   </table>   
{% endblock %}
