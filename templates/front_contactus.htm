{% extends "front_template.htm" %}
{% load static %}

{% block title%}
    <style>
		
		td {
			text-align: left;
		}
	</style>
    <title>史打克工業 - 聯絡表單</title>
{% endblock%}	

{% block content%}
	<div id="topic">
		<div class="formSet">
			<form action="/contactus/addform/" method="POST" enctype="multipart/form-data">
				 {% csrf_token %}
				<table class="table table-dark table-sm table-bordered border-danger" style="font-size:20px; text-align: center;" id="rawTable">
					<tr>
						<td>
							<div class="mb-3">
								<label class="form-label" for="companyname">公司名稱：</label>
							</div>
						</td>
						<td>
							<div class="mb-3">
								<input class="form-control" name="companyname" maxlength="30"/>
							</div>
						</td>
						<td>
							<div class="mb-3">
								<label class="form-label" for="contactname">聯絡人名稱：</label>
							</div>
						</td>
						<td>
							<div class="mb-3">
								<input class="form-control" name="contactname" maxlength="10" required />
							</div>
						</td>
					</tr>
					<tr>
						<td>
							<div class="mb-3">
								<label class="form-label" for="address">地址：</label>
							</div>
						</td>
						<td colspan="3">
							<div class="mb-3">
								<input class="form-control" name="address" maxlength="100" required/>
							</div>
						</td>
					</tr>
					<tr>
						<td>
							<div class="mb-3">
								<label class="form-label" for="phone">電話：</label>
							</div>
						</td>
						<td>
							<div class="mb-3">
								<input class="form-control" type="tel" name="phone" maxlength="20" required />
							</div>
						</td>
						<td>
							<div class="mb-3">
								<label class="form-label" for="email">Email：</label>
							</div>
						</td>
						<td>
							<div class="mb-3">
								<input class="form-control" type="email" name="email" maxlength="100" required />
							</div>
						</td>
					</tr>
					<tr>
						<td>
							<div class="mb-3">
								<label class="form-label" for="title">標題：</label>
							</div>
						</td>
						<td colspan="3">
							<div class="mb-3">
								<input class="form-control" name="title" maxlength="30" required /><br>
							</div>
						</td>
					</tr>
					<tr>
						<td colspan="4">
							<label class="form-label" for="content">內容：</label><br>
							<textarea class="form-control" name="content" rows="10" cols="50" required></textarea><br>
							<div style="text-align: right;">
								<input class="btn btn-secondary" style="text-align: right;" type="reset" value="重置" />
								<input class="btn btn-danger" style="text-align: right;" type="submit" value="送出" />							
							</div>												
						</td>
					</tr>
			</table>
		</form>
	</div>
	</div>
{% endblock %}
